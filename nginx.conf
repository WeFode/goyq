# new-web 生产部署 Nginx 配置
# 用法：将 dist 目录内容部署到 /www/server/nginx/www/new-web，并按需调整 upstream 与端口
#
# 与旧版 web/nginx.conf 的差异：
# 1. 后端地址、监听端口提为注释化的可替换项，避免把 IP 写死在多处；
# 2. 静态资源改为按目录前缀匹配（构建产物统一在 /static 下），SPA 回退更明确；
# 3. 增加 gzip 与安全响应头。

# WebSocket 连接升级映射，必须在 http 块中定义
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 10086;
    server_name _;

    root /www/server/nginx/www/new-web;
    index index.html;

    # 后端服务地址（按环境替换）
    set $backend http://113.45.29.120:10083;

    # ============ 静态资源：强缓存 ============
    location ^~ /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html 不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ============ 业务接口 ============
    location ^~ /api/v1 {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket 支持
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

        add_header Access-Control-Allow-Origin  $http_origin always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization' always;
        add_header Access-Control-Allow-Credentials true always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # ============ 附件 ============
    location ^~ /files/ {
        proxy_pass $backend/;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ============ 接口文档 ============
    location ^~ /swagger/ {
        proxy_pass $backend;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api.json {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # ============ SPA 路由回退 ============
    location / {
        # WebSocket 握手请求转发到后端
        if ($http_upgrade = "websocket") {
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_vary on;
}
